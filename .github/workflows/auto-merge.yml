name: Auto-merge

# Turns on auto-merge for pull requests from the repository owner. GitHub then
# merges each one by itself once the required "test" check passes. A draft is
# left alone, so opening a draft is the way to ask for a look first.
# Pull requests from forks never run this with write access, so they stay manual.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge --auto --merge "$PR_URL"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
